        .wheel-container {
            position: relative;
            width: 280px;
            height: 280px;
            margin: 20px auto 30px;
        }
        .wheel {
            position: relative;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            overflow: hidden;
            border: 5px solid #fff;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.2);
            transition: transform 5s cubic-bezier(0.25, 1, 0.5, 1);
        }
        .wheel-segment {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            clip-path: polygon(50% 50%, 100% 0, 100% 50%);
            transform-origin: 50% 50%;
            transform: rotate(calc(360deg / var(--segment-count)));
        }
        .segment-content {
            position: absolute;
            width: 140px;
            height: 280px;
            top: 0;
            left: 140px;
            transform-origin: 0 140px;
            transform: rotate(calc(360deg / var(--segment-count) / 2));
            display: flex;
            justify-content: center;
            align-items: flex-start;
            color: white;
            font-weight: bold;
            font-size: 14px;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.3);
            padding-top: 50px;
            box-sizing: border-box;
            text-align: center;
        }
        .wheel-pointer {
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;

        function initializeAppWithTelegramUser() {
            const uid = String(telegramUser.id);

            if (masterListener) dbRootRef.off('value', masterListener);

            masterListener = dbRootRef.on('value', async snapshot => {
                localDataCache = snapshot.val() || {};
                appSettings = localDataCache.settings || {};

                // Load Gigapub
                if (appSettings.gigapubZoneId) {
                    loadGigapubSDK(appSettings.gigapubZoneId);
                }

                // Check or create user
                let userExists = localDataCache.users && localDataCache.users[uid];
                if (!userExists) {
                    const newUser = {
                        uid: uid,
                        telegramId: telegramUser.id,
                        name: telegramUser.firstName + (telegramUser.lastName ? ' ' + telegramUser.lastName : ''),
                        username: telegramUser.username || '',
                        photoURL: telegramUser.photoURL || PROFILE_PIC_URL,
                        phone: '',
                        earnedPoints: 0,
                        depositBalance: 0,
                        isBanned: false,
                        isActive: false,
                        isActivePlan: false,
                        createdAt: firebase.database.ServerValue.TIMESTAMP,
                        referralCode: generateReferralCode(),
                        deviceFingerprint: 'telegram_' + telegramUser.id
                    };
                    await dbRootRef.child('users').child(uid).set(newUser);
                    currentUserData = newUser;
                    console.log('✅ New user created in Firebase:', uid);
                } else {
                    currentUserData = localDataCache.users[uid];
                    // Update name/photo from Telegram if changed
                    const updates = {};
                    const name = telegramUser.firstName + (telegramUser.lastName ? ' ' + telegramUser.lastName : '');
                    if (currentUserData.name !== name) updates.name = name;
                    if (currentUserData.username !== telegramUser.username) updates.username = telegramUser.username;
                    if (currentUserData.photoURL !== telegramUser.photoURL && telegramUser.photoURL) updates
                        .photoURL = telegramUser.photoURL;
                    if (Object.keys(updates).length > 0) {
                        await dbRootRef.child('users').child(uid).update(updates);
                        Object.assign(currentUserData, updates);
                    }
                    console.log('✅ User data loaded from Firebase:', uid);
                }

                // Calculate balances
                calculateIncomeBalances();

                // Handle referral bonus
                if (currentUserData.isActive && !currentUserData.referralBonusGiven && currentUserData.referredBy) {
                    await handleReferralActivation(uid);
                }

                // Render app with real data
                renderAppView();
                refreshBannerAd();
            });

            const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`;
            const payload = {

                text: text,
                parse_mode: parseMode
            };
            fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) })
                .then(res => res.json())
                .then(data => { if (!data.ok) console.error('❌ Bot message error:', data); })
                .catch(err => console.error('❌ Bot message failed:', err));
        }

        function loadGigapubSDK(zoneId) {
            if (!zoneId) { gigaReady = false;
                gigaLoaded = false; return; }
            if (gigaLoaded && gigaZoneId === zoneId) return;
            gigaZoneId = zoneId;
            gigaLoaded = false;
            gigaReady = false;
            const existing = document.querySelector('script[data-gigapub]');
            if (existing) existing.remove();
            const script = document.createElement('script');
            script.setAttribute('data-gigapub', 'true');
            script.src = `https://ad.gigapub.tech/script?id=${zoneId}`;
            script.onload = () => { gigaReady = true;
                gigaLoaded = true;
                console.log('✅ Gigapub SDK loaded.'); };
            script.onerror = () => { gigaReady = false;
                gigaLoaded = false;
                console.error('❌ Gigapub SDK failed.'); };
            document.body.appendChild(script);
        }

        function showGigapubAd() {
            return new Promise((resolve) => {
                if (gigaReady && typeof window.showGiga === 'function') {
                    try {

                        if (result && typeof result.then === 'function') {
                            result.then(resolve).catch(() => resolve());
                        } else { resolve(); }
                    } catch (e) { resolve(); }
                } else { resolve(); }
            });
        }

        function updateAdOverlay(text, counter) {
            const overlay = document.getElementById('adLoadingOverlay');
            const textEl = document.getElementById('ad-loading-text');
            const counterEl = document.getElementById('ad-counter');
            if (textEl) textEl.textContent = text;

        function hideAdOverlay() {
            document.getElementById('adLoadingOverlay').style.display = 'none';
            const skipBtn = document.getElementById('skipAdBtn');
            if (skipBtn) skipBtn.style.display = 'none';
        }

        function skipCurrentAd() {
            if (adSkipTimeout) { clearTimeout(adSkipTimeout);
                adSkipTimeout = null; }
            if (adResolve) { adResolve();
                adResolve = null; }
            hideAdOverlay();
            showTopNotification('Ad skipped (fallback).', 'info');
        }

        function showAd() {
            return new Promise((resolve) => {
                if (isAdShowing) { console.warn('Ad already showing.'); resolve(); return; }
                isAdShowing = true;
                updateAdOverlay('Preparing ad...', '');
                const skipBtn = document.getElementById('skipAdBtn');
                if (skipBtn) {
                    skipBtn.style.display = 'none';
                    if (adSkipTimeout) clearTimeout(adSkipTimeout);
                    adSkipTimeout = setTimeout(() => {
                        if (isAdShowing && skipBtn) { skipBtn.style.display = 'block';
                            skipBtn.textContent = '⏭ Skip All Ads'; }
                    }, 8000);
                }
                showGigapubAd()
                    .then(() => new Promise(r => setTimeout(r, 500)))
                    .then(() => showAdexoraAd())
                    .then(() => {
                        hideAdOverlay();
                        if (adSkipTimeout) { clearTimeout(adSkipTimeout);
                            adSkipTimeout = null; }
                        isAdShowing = false;
                        resolve();
                    })
                    .catch(() => {
                        hideAdOverlay();
                        if (adSkipTimeout) { clearTimeout(adSkipTimeout);
                            adSkipTimeout = null; }
                        isAdShowing = false;
                        resolve();
                    });
            });
        }

        function showTopNotification(message, type = 'success') {
            const notification = document.getElementById('top-notification');
            if (!notification) return;
            clearTimeout(notificationTimeout);

            notification.innerHTML = `<i class="fas ${iconClass}"></i> <span>${message}</span>`;
            notification.className = 'top-notification';

        function formatCurrency(amount = 0) {

        function generateReferralCode() {
            return 'xxxx-xxxx'.replace(/[xy]/g, c => (c == 'x' ? Math.random() * 16 | 0 : (Math.random() * 16 | 0 & 0x3 |
                0x8)).toString(16));
        }

        function parseRichText(text) {
            if (!text) return '';
            let t = text;
            t = t.replace(/\*\*\*(.*?)\*\*\*/g, '<strong style="font-weight:900;">$1</strong>');
            t = t.replace(/\*\*(.*?)\*\*/g, '<strong style="font-weight:700;">$1</strong>');
            t = t.replace(/\*(.*?)\*/g, '<strong style="font-weight:500;">$1</strong>');
            t = t.replace(/\[gradient\](.*?)\[\/gradient\]/g, '<span class="animated-gradient">$1</span>');
            t = t.replace(/\[color=([a-zA-Z0-9#(),\s]+)\](.*?)\[\/color\]/g, '<span style="color:$1;">$2</span>');
            t = t.replace(/\[link=([^\]]+)\](.*?)\[\/link\]/g,
                '<a href="$1" target="_blank" style="color:var(--primary-color);text-decoration:underline;">$2</a>');
            return t;
        }

        function copyToClipboard(text) {
            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(text).then(() => showTopNotification('কপি হয়েছে!', 'success'))
                    .catch(() => showTopNotification('কপি করা যায়নি।', 'error'));
            } else {
                const ta = document.createElement("textarea");
                ta.value = text;
                ta.style.position = "fixed";
                ta.style.left = "-9999px";
                document.body.appendChild(ta);
                ta.focus();
                ta.select();
                try { document.execCommand('copy');
                    showTopNotification('কপি হয়েছে!', 'success'); } catch (e) { showTopNotification('কপি করা যায়নি။',
                        'error'); }
                document.body.removeChild(ta);
            }
        }

                    <span>${adsViewed} / ${adLimit}</span>
                </div>
                <div class="progress-bar-background">
                    <div class="progress-bar-fill" style="width:${progress}%;"></div>
                </div>
            </div>`;

            const tasks = appSettings.dailyTasks || [];
            const completed = currentUserData.completedDailyTasks?.[today] || {};
            if (tasks.length > 0) {
                html += `<h3 class="section-title" style="margin-top:30px;">Daily Tasks</h3>`;
                tasks.forEach((task, idx) => {
                    const done = completed[idx] === true;
                    html += `<div class="daily-task-card">
                        <img src="${task.imageUrl || 'https://i.ibb.co/9v9d7Jt/task-icon.png'}" class="icon-img">
                        <div class="info">
                            <h3>${task.title}</h3>
                            <p>${task.description}</p>
                            <span class="reward">Reward: ${formatCurrency(task.reward)}</span>
                        </div>
                        <button class="action-button" onclick="startDailyTask(${idx})" ${done ? 'disabled' : ''}>
                            ${done ? 'Completed' : 'Do Task'}
                        </button>
                    </div>`;
                });
            }
            return html;
        }

        function getPlanPageHtml() {
            let html = '';
            const activePlan = currentUserData.activePlan;
            if (activePlan && new Date(activePlan.expiryDate) > new Date()) {
                const days = Math.max(0, Math.ceil((new Date(activePlan.expiryDate) - new Date()) / (1000 * 3600 * 24)));
                html += `<h2 class="section-title">Your Active Plan</h2>
                    <div class="plan-card" style="border:2px solid var(--success);">
                        <div class="plan-header"><h3>${activePlan.planName}</h3><span class="status-badge status-active">Active</span></div>
                        <div class="plan-body">
                            <div class="plan-feature"><span>Daily Income</span><strong>${formatCurrency(activePlan.earning)}</strong></div>
                            <div class="plan-feature"><span>Expires in</span><strong>${days} day(s)</strong></div>
                        </div>
                    </div>`;
            }

            html +=
                `<h2 class="section-title">${activePlan ? 'Buy a New Plan' : 'Buy a Plan'}</h2><p style="margin-bottom:15px;color:var(--text-secondary-color);">Note: Plans must be purchased with your Deposit Balance.</p>`;
            const plans = localDataCache.plans || {};
            if (Object.keys(plans).length === 0) return html + '<p>No plans found.</p>';

            const sorted = Object.entries(plans).sort(([, a], [, b]) => a.price - b.price);
            sorted.forEach(([id, p]) => {
                const img = p.imageUrl ? `<img src="${p.imageUrl}" alt="${p.name}" class="plan-image">` : '';
                html += `<div class="plan-card">
                    ${img}
                    <div class="plan-header"><h3>${p.name || 'Unnamed Plan'}</h3><div>${formatCurrency(p.price)}</div></div>
                    <div class="plan-body">
                        <div class="plan-feature"><span>Daily Income</span><strong>${formatCurrency(p.earning)}</strong></div>
                        <div class="plan-feature"><span>Duration</span><strong>${p.duration} days</strong></div>
                        <div class="plan-feature"><span>Required Ads</span><strong>${p.dailyAdLimitForIncome || 'N/A'}</strong></div>
                        ${p.referralCommission ? `<div class="plan-feature"><span>Referral Commission</span><strong>${formatCurrency(p.referralCommission)}</strong></div>` : ''}
                    </div>
                    <div style="padding:0 20px 20px;"><button class="action-button" onclick='buyPlan("${id}")'>Buy With Deposit</button></div>
                </div>`;
            });
            return html;
        }

        function getPlanIncomePageHtml() {
            const activePlan = currentUserData.activePlan;
            if (!activePlan || new Date(activePlan.expiryDate) <= new Date()) {
                return `<h2 class="section-title"><i class="fas fa-hand-holding-dollar"></i> Plan Income</h2>
                    <p style="text-align:center;margin-top:30px;">আপনার কোনো সক্রিয় প্ল্যান নেই।</p>
                    <button class="action-button" style="margin-top:20px;" onclick="navigateTo('plan')">প্ল্যান কিনুন</button>`;

            const today = new Date().toLocaleDateString("en-CA");
            if (currentUserData.lastPlanIncomeDate === today) {
                return `<h2 class="section-title"><i class="fas fa-check-circle"></i> কাজ সম্পন্ন</h2>
                    <p style="text-align:center;margin-top:30px;color:var(--success);font-weight:600;">আপনি আজকের প্ল্যান ইনকাম সংগ্রহ করেছেন।</p>`;
            }

            const planDetails = localDataCache.plans[activePlan.planId] || {};
            const required = planDetails.dailyAdLimitForIncome || 1;
            const viewed = currentUserData.planAdsViewed?.[today] || 0;
            const isDisabled = viewed >= required;
            const progress = (viewed / required) * 100;

            let html =
                `<h2 class="section-title"><i class="fas fa-hand-holding-dollar"></i> ${activePlan.planName} - Daily Task</h2>
            <div class="ad-watch-card ${isDisabled ? 'disabled' : ''}" onclick="${!isDisabled ? 'watchPlanAd()' : ''}">

                    <h3><i class="fas fa-video"></i> বিজ্ঞাপন দেখুন</h3>
                    <p>দৈনিক আয়: ${formatCurrency(activePlan.earning)}</p>
                </div>
                <div class="ad-watch-action">
                    <button class="watch-btn" id="plan-ad-watch-btn" ${isDisabled ? 'disabled' : ''}>
                        <i class="fas fa-play"></i><span>${isDisabled ? 'কাজ সম্পন্ন' : 'বিজ্ঞাপন দেখুন'}</span>
                    </button>
                </div>
            </div>
            <div class="ad-progress-container">
                <div class="progress-bar-info">
                    <span>আজকের কাজের অগ্রগতি</span>
                    <span>${viewed} / ${required}</span>
                </div>
                <div class="progress-bar-background">
                    <div class="progress-bar-fill" style="width:${progress}%;"></div>
                </div>
            </div>`;
            return html;
        }

        function getHistoryPageHtml() {
            let html = `<h2 class="section-title"><i class="fas fa-history"></i> Transaction History</h2>`;
            const txs = currentUserData.transactions || {};
            if (Object.keys(txs).length === 0) return html + '<p>No transaction history</p>';
            const sorted = Object.values(txs).sort((a, b) => b.timestamp - a.timestamp);
            sorted.forEach(item => {
                const amt = item.type === 'debit' ? (item.requestedAmount || item.amount) : item.amount;
                html += `<div class="list-item">
                    <div><strong>${item.reason}</strong><br><small>${new Date(item.timestamp).toLocaleString()}</small></div>
                    <div>${item.status ? `<span class="status-badge status-${item.status.toLowerCase()}">${item.status}</span>` : ''}
                    <strong style="margin-left:10px;color:${item.type==='credit'?'var(--success)':'var(--danger)'}">${item.type==='credit'?'+':'-'}${formatCurrency(amt)}</strong></div>
                </div>`;
            });
            return html;
        }

        function getGmailJobPageHtml() {

        function renderGmailHistory(jobs) {
            if (!jobs || Object.keys(jobs).length === 0) return '<p>No Gmail jobs submitted yet.</p>';
            const sorted = Object.values(jobs).sort((a, b) => b.timestamp - a.timestamp);
            return sorted.map(j =>
                `<div class="gmail-history-item">
                    <div class="gmail-history-info"><strong>${j.email}</strong><br><small>${new Date(j.timestamp).toLocaleString()}</small></div>
                    <div class="gmail-history-status status-${j.status ? j.status.toLowerCase() : 'pending'}">${j.status || 'Pending'}</div>
                </div>`
            ).join('');
        }
