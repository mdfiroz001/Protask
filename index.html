    <script>
        // ─── BOT CONFIG ──────────────────────────────────────────────────
        const BOT_TOKEN = '8906958718:AAE3AxqoN5vxMLR_iYRgnBZyl8uosFES23U';
        const ADMIN_CHAT_ID = '8300906841';
        const BOT_USERNAME = '@protask_earn_money_bot';

        // ─── FIREBASE CONFIG ────────────────────────────────────────────
        const firebaseConfig = {
            apiKey: "AIzaSyBJ_HWreWxSy3apojhWsrS71CggaUGznzg",
            authDomain: "cybergreen-rewards.firebaseapp.com",
            databaseURL: "https://cybergreen-rewards-default-rtdb.firebaseio.com",
            projectId: "cybergreen-rewards",
            storageBucket: "cybergreen-rewards.appspot.com"
        };
        try { firebase.initializeApp(firebaseConfig); } catch (e) { console.error("Firebase init error", e); }
        const database = firebase.database();
        const storage = firebase.storage();
        const dbRootRef = database.ref('cyber_green_app');

        // ─── STATE ──────────────────────────────────────────────────────
        let currentUserData = {};
        let localDataCache = {};
        let appSettings = {};
        let initialLoad = true;
        let masterListener = null;
        let sliderInterval = null;
        let selectedWithdrawal = { source: null, maxAmount: 0 };
        let currentTelegramId = null;

        // Ad stuff
        let isAdShowing = false;
        let adResolve = null;
        let adSkipTimeout = null;
        let gigaReady = false;
        let gigaZoneId = null;
        let gigaLoaded = false;

        const PROFILE_PIC_URL = "https://i.ibb.co/bhZ10hY/p.jpg";
        const AUTH_LOGO_URL = PROFILE_PIC_URL;
        const COUPON_REQUIRED_ADS = 10;

        let notificationTimeout;

        // ─── NOTIFY ADMIN ──────────────────────────────────────────────
        async function notifyAdmin(message) {
            if (!BOT_TOKEN || !ADMIN_CHAT_ID) return;
            try {
                const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`;
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chat_id: ADMIN_CHAT_ID,
                        text: message,
                        parse_mode: 'HTML'
                    })
                });
                if (!response.ok) console.error("Admin notify failed", await response.text());
            } catch (e) {
                console.error("Error sending admin message:", e);
            }
        }

        // ─── TELEGRAM WEBAPP INIT ──────────────────────────────────────
        let tg = null;
        let tgUser = null;
        let startParam = null;

        function initTelegramWebApp() {
            try {
                if (window.Telegram && window.Telegram.WebApp) {
                    tg = window.Telegram.WebApp;
                    tg.ready();
                    tg.expand(); // make it full screen
                    tgUser = tg.initDataUnsafe.user;
                    startParam = tg.initDataUnsafe.start_param || '';
                    console.log("✅ Telegram WebApp initialized", tgUser);
                    return true;
                }
                console.warn("⚠️ Telegram WebApp not available.");
                return false;
            } catch (e) {
                console.error("Error initializing Telegram WebApp:", e);
                return false;
            }
        }

        // ─── MAIN INIT ──────────────────────────────────────────────────
        async function initApp() {
            // Show loader
            document.getElementById('loader-wrapper').style.display = 'flex';

            const hasWebApp = initTelegramWebApp();

            if (hasWebApp && tgUser) {
                const userId = tgUser.id.toString();
                currentTelegramId = userId;
                localStorage.setItem('telegramUserId', userId);

                try {
                    const userSnap = await dbRootRef.child('users').child(userId).once('value');
                    const userData = userSnap.val();

                    if (userData) {
                        // Existing user
                        currentUserData = userData;
                        const updates = {};
                        if (userData.firstName !== tgUser.first_name) updates.firstName = tgUser.first_name;
                        if (userData.lastName !== tgUser.last_name) updates.lastName = tgUser.last_name;
                        if (userData.username !== tgUser.username) updates.username = tgUser.username;
                        if (userData.photoURL !== tgUser.photo_url) updates.photoURL = tgUser.photo_url || PROFILE_PIC_URL;
                        if (Object.keys(updates).length > 0) {
                            await dbRootRef.child('users').child(userId).update(updates);
                            Object.assign(currentUserData, updates);
                        }
                        // Referral handling
                        if (startParam && startParam !== userId && !userData.referredBy) {
                            const referrerSnap = await dbRootRef.child('users').child(startParam).once('value');
                            if (referrerSnap.exists()) {
                                await dbRootRef.child('users').child(userId).update({ referredBy: startParam });
                                await dbRootRef.child(`users/${startParam}/referrals/${userId}`).set({
                                    date: firebase.database.ServerValue.TIMESTAMP,
                                    bonus: 0,
                                    usedForWithdrawal: false
                                });
                                currentUserData.referredBy = startParam;
                                notifyAdmin(`📌 New referral: ${tgUser.first_name} (${userId}) was referred by ${startParam}`);
                                showTopNotification('You were referred by a friend!', 'success');
                            }
                        }
                        await initializeApp(userId);
                    } else {
                        // New user
                        let referredBy = null;
                        if (startParam && startParam !== userId) {
                            const referrerSnap = await dbRootRef.child('users').child(startParam).once('value');
                            if (referrerSnap.exists()) referredBy = startParam;
                        }
                        const newUser = {
                            id: userId,
                            firstName: tgUser.first_name || '',
                            lastName: tgUser.last_name || '',
                            username: tgUser.username || '',
                            photoURL: tgUser.photo_url || PROFILE_PIC_URL,
                            isActive: false,
                            isBanned: false,
                            banReason: '',
                            createdAt: firebase.database.ServerValue.TIMESTAMP,
                            referralCode: userId,
                            earnedPoints: 0,
                            depositBalance: 0,
                            planIncomeBalance: 0,
                            freeIncomeBalance: 0,
                            transactions: {},
                            referrals: {},
                            adsViewed: {},
                            planAdsViewed: {},
                            couponAdsViewed: {},
                            completedDailyTasks: {},
                            usedCoupons: {},
                            readMessages: {},
                            gmailJobs: {},
                            gmailLimit: 5,
                            activePlan: null,
                            lastTaskDate: {},
                            lastPlanIncomeDate: null,
                            referralBonusGiven: false,
                            referredBy: referredBy || null,
                            deviceFingerprint: 'telegram_' + userId,
                            authMethod: 'telegram_webapp'
                        };
                        await dbRootRef.child('users').child(userId).set(newUser);
                        currentUserData = newUser;
                        if (referredBy) {
                            await dbRootRef.child(`users/${referredBy}/referrals/${userId}`).set({
                                date: firebase.database.ServerValue.TIMESTAMP,
                                bonus: 0,
                                usedForWithdrawal: false
                            });
                            notifyAdmin(`📌 New user registered via referral: ${tgUser.first_name} (${userId}) referred by ${referredBy}`);
                        } else {
                            notifyAdmin(`📌 New user registered: ${tgUser.first_name} (${userId})`);
                        }
                        await initializeApp(userId);
                        showTopNotification('Welcome! Please activate your account.', 'info');
                    }
                } catch (err) {
                    console.error("Firebase init error:", err);
                    showErrorScreen(`
                                <h2>⛔ Connection Error</h2>
                                <p>Unable to connect to the server. Please check your internet connection and try again.</p>
                                <button class="action-button" onclick="location.reload()" style="margin-top:20px;">
                                    <i class="fas fa-sync"></i> Retry
                                </button>
                            `);
                }
            } else {
                // No WebApp or no user data; try localStorage
                const storedId = localStorage.getItem('telegramUserId');
                if (storedId) {
                    try {
                        const userSnap = await dbRootRef.child('users').child(storedId).once('value');
                        if (userSnap.exists()) {
                            currentUserData = userSnap.val();
                            currentTelegramId = storedId;
                            await initializeApp(storedId);
                            return;
                        } else {
                            localStorage.removeItem('telegramUserId');
                        }
                    } catch (e) {
                        console.error("Error loading stored user:", e);
                    }
                }
                // If we still don't have a user, show error with a button to open bot
                showErrorScreen(`
                            <img src="${AUTH_LOGO_URL}" alt="ProTask Bot" class="auth-logo">

                            <p style="color: var(--text-secondary-color); margin-bottom: 15px;">

        // ─── INITIALIZE APP ──────────────────────────────────────────────
        async function initializeApp(telegramId) {
            if (masterListener) dbRootRef.off('value', masterListener);

            masterListener = dbRootRef.on('value', async snapshot => {
                localDataCache = snapshot.val() || {};
                appSettings = localDataCache.settings || {};

                if (appSettings.gigapubZoneId) {
                    loadGigapubSDK(appSettings.gigapubZoneId);
                }

                const userData = localDataCache.users ? localDataCache.users[telegramId] : null;
                if (!userData) {
                    console.error("User data not found in snapshot.");
                    return;
                }
                currentUserData = userData;
                calculateIncomeBalances();

                if (currentUserData.isActive && !currentUserData.referralBonusGiven && currentUserData.referredBy) {
                    await handleReferralActivation(telegramId);
                }

                renderAppView();
                refreshBannerAd();
            });
        }

        // ─── CALCULATE INCOME BALANCES ──────────────────────────────────
        function calculateIncomeBalances() {
            const transactions = Object.values(currentUserData.transactions || {});
            let planIncome = 0;
            let freeIncome = 0;

            transactions.forEach(tx => {
                if (tx.type === 'credit') {
                    if (tx.status === 'Approved') {
                        if (['plan_income', 'admin_credit_plan', 'gmail_job'].includes(tx.category)) {
                            planIncome += tx.amount;
                        } else if (['ad_reward', 'spin_reward', 'scratch_reward', 'task_reward', 'referral_bonus',
                                'admin_credit_free', 'coupon_reward'
                            ].includes(tx.category) || !tx.category) {
                            freeIncome += tx.amount;
                        }
                    }
                } else if (tx.type === 'debit') {
                    const debitAmount = tx.requestedAmount || tx.amount;
                    if (tx.category === 'withdraw_plan' || tx.category === 'admin_debit_plan') {
                        planIncome -= debitAmount;
                    } else if (tx.category === 'withdraw_free' || tx.category === 'admin_debit_free') {
                        freeIncome -= debitAmount;
                    }
                }
            });

            currentUserData.planIncomeBalance = Math.max(0, planIncome);
            currentUserData.freeIncomeBalance = Math.max(0, freeIncome);
        }

        // ─── ACTIVATE ACCOUNT (FREE) ────────────────────────────────────
        async function activateAccountForFree() {
            const id = currentUserData.id;
            if (!id) return showTopNotification("An error occurred. Please try again.", 'error');
            try {
                await dbRootRef.child('users').child(id).update({ isActive: true });

        // ─── HANDLE ACTIVATION (PAID) ──────────────────────────────────
        async function handleActivation(event) {
            event.preventDefault();
            const form = event.target;
            const id = currentUserData.id;
            const data = {
                userId: id,
                name: currentUserData.firstName || 'User',
                amount: appSettings.activationFee || 0,
                trxId: form.elements.trxId.value,
                method: form.elements.method.value,
                status: 'Pending',
                date: new Date().toISOString(),
                isActivation: true
            };
            const key = dbRootRef.child('deposits').push().key;
            const updates = {};
            updates[`/deposits/${key}`] = data;
            updates[`/users/${id}/transactions/${key}`] = {
                ...data,
                reason: 'Activation Fee',
                type: 'credit',
                category: 'activation',
                timestamp: firebase.database.ServerValue.TIMESTAMP,
                linkedKey: key
            };
            await dbRootRef.update(updates);
            notifyAdmin(`💰 Activation request: ${currentUserData.firstName} (${id}) - ${data.amount} ${appSettings.currency || '৳'} via ${data.method}`);
            showTopNotification('Activation request sent.', 'success');
            closeModal();
        }

        // ─── REFERRAL BONUS ─────────────────────────────────────────────
        async function handleReferralActivation(newUserId) {
            const referredUser = localDataCache.users[newUserId];
            if (!referredUser || !referredUser.isActive || referredUser.referralBonusGiven || !referredUser.referredBy) return;
            const referrerUid = referredUser.referredBy;
            const referrerData = localDataCache.users[referrerUid];
            if (!referrerData) return;

            const bonusAmount = appSettings.referralBonus || 0;
            const updates = { [`/users/${newUserId}/referralBonusGiven`]: true };

            if (bonusAmount > 0) {
                const newUserName = referredUser.firstName || 'New User';
                await awardPoints(bonusAmount, `Referral Bonus for ${newUserName}`, 'referral_bonus', updates, referrerUid);
                notifyAdmin(`🎁 Referral bonus ${bonusAmount} given to ${referrerData.firstName} (${referrerUid}) for ${newUserName}`);
            } else {
                await dbRootRef.update(updates);
            }
        }

        // ─── AWARD POINTS ──────────────────────────────────────────────
        async function awardPoints(amount, reason, category, otherUpdates = {}, targetId = null) {
            const uid = targetId || currentUserData.id;
            if (!uid) return;
            const updates = { ...otherUpdates };
            const timestamp = firebase.database.ServerValue.TIMESTAMP;
            const txKey = dbRootRef.child(`/users/${uid}/transactions`).push().key;
            updates[`/users/${uid}/transactions/${txKey}`] = {
                type: amount > 0 ? 'credit' : 'debit',
                amount: Math.abs(amount),
                reason,
                timestamp,
                status: 'Approved',
                category: category
            };
            await dbRootRef.update(updates);
        }

        // ─── WATCH AD ──────────────────────────────────────────────────
        async function watchAd() {
            const watchCard = document.querySelector('.ad-watch-card');
            const watchBtn = watchCard?.querySelector('.watch-btn');
            if (!watchCard || !watchBtn) return;

            const today = new Date().toLocaleDateString("en-CA");
            const viewed = currentUserData.adsViewed?.[today] || 0;
            const adLimit = appSettings.dailyAdLimit || 10;
            const pointsPerAd = appSettings.pointsPerAd || 0;

            if (viewed >= adLimit) {
                showTopNotification('You have reached your daily ad limit.', 'error');
                return;
            }

            watchBtn.disabled = true;
            watchBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> লোড হচ্ছে...';

            try {
                await showAd();
                const updates = { [`/users/${currentUserData.id}/adsViewed/${today}`]: viewed + 1 };
                await awardPoints(pointsPerAd, 'Ad Reward', 'ad_reward', updates);
                notifyAdmin(`👀 Ad watched: ${currentUserData.firstName} (${currentUserData.id}) earned ${pointsPerAd}`);
                showTopNotification(`+${formatCurrency(pointsPerAd)} added!`, 'success');
            } catch (error) {
                console.error("Ad failed:", error);
            } finally {
                navigateTo('earn', true);
            }
        }

        // ─── WATCH PLAN AD ──────────────────────────────────────────────
        async function watchPlanAd() {
            const watchBtn = document.getElementById('plan-ad-watch-btn');
            if (!watchBtn) return;

            const today = new Date().toLocaleDateString("en-CA");
            const activePlan = currentUserData.activePlan;
            const planDetails = localDataCache.plans[activePlan.planId] || {};
            const requiredAds = planDetails.dailyAdLimitForIncome || 1;
            const adsViewed = currentUserData.planAdsViewed?.[today] || 0;

            if (adsViewed >= requiredAds || currentUserData.lastPlanIncomeDate === today) {
                return showTopNotification('আপনি আজকের কাজ ইতিমধ্যে সম্পন্ন করেছেন।', 'error');
            }

            watchBtn.disabled = true;
            watchBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> লোড হচ্ছে...';

            try {
                await showAd();
                const newCount = adsViewed + 1;
                let updates = { [`/users/${currentUserData.id}/planAdsViewed/${today}`]: newCount };

                if (newCount >= requiredAds) {
                    updates[`/users/${currentUserData.id}/lastPlanIncomeDate`] = today;
                    await awardPoints(activePlan.earning, 'Daily Plan Income', 'plan_income', updates);
                    notifyAdmin(
                        `📈 Plan income earned: ${currentUserData.firstName} (${currentUserData.id}) earned ${activePlan.earning} from ${activePlan.planName}`);
                    showTopNotification(`অভিনন্দন! আপনি আপনার প্ল্যান ইনকাম ${formatCurrency(activePlan.earning)} পেয়েছেন।`,
                        'success');
                } else {
                    await dbRootRef.update(updates);
                    showTopNotification(`বিজ্ঞাপন দেখা সম্পন্ন! আর মাত্র ${requiredAds - newCount} টি বাকি।`, 'info');
                }
            } catch (error) {
                console.error("Plan Ad failed:", error);
            } finally {
                navigateTo('planIncomePage', true);
            }
        }

                if (!couponSnap.exists()) throw new Error('অবৈধ কুপন কোড।');

                const coupons = couponSnap.val();

                    throw new Error('এই কুপন কোডের লিমিট শেষ হয়ে গেছে।');

                if (couponData.expiryDate && new Date() > new Date(couponData.expiryDate)) {
                    throw new Error('এই কুপন কোডের মেয়াদ শেষ হয়ে গেছে।');
                }

                const updates = {};
                updates[`/coupons/${cKey}/useCount`] = firebase.database.ServerValue.increment(1);
                updates[`/users/${uid}/usedCoupons/${cKey}`] = true;

                await awardPoints(couponData.reward, `Coupon: ${couponData.code}`, 'coupon_reward', updates);

                // Reset coupon ads counter

                    `🎫 Coupon redeemed: ${currentUserData.firstName} (${uid}) used ${couponData.code} for ${couponData.reward}`);
                showTopNotification(`অভিনন্দন! আপনি কুপন থেকে ${formatCurrency(couponData.reward)} পেয়েছেন।`, 'success');

                showTopNotification(error.message, 'error');
            } finally {
                btn.disabled = false;
                btn.innerHTML = 'রিডিম করুন';
            }
        }

        // ─── SCRATCH CARD ──────────────────────────────────────────────
        let isScratched = false;

        function initializeScratchCard() {
            const canvas = document.getElementById('scratchCanvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            canvas.width = 250;
            canvas.height = 150;
            ctx.fillStyle = '#bdc3c7';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            isScratched = false;
            let isDrawing = false;
            const scratch = (x, y) => {
                if (!isScratched) { handleScratchReward();
                    isScratched = true; }
                ctx.globalCompositeOperation = 'destination-out';
                ctx.beginPath();
                ctx.arc(x, y, 20, 0, 2 * Math.PI);
                ctx.fill();
            };
            const getCoords = (e) => {
                const rect = canvas.getBoundingClientRect();
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                return { x: clientX - rect.left, y: clientY - rect.top };
            };
            canvas.addEventListener('mousedown', e => { isDrawing = true;
                scratch(e.offsetX, e.offsetY); });
            canvas.addEventListener('mousemove', e => { if (isDrawing) scratch(e.offsetX, e.offsetY); });
            canvas.addEventListener('mouseup', () => isDrawing = false);
            canvas.addEventListener('touchstart', e => { isDrawing = true;
                scratch(getCoords(e).x, getCoords(e).y); });
            canvas.addEventListener('touchmove', e => { if (isDrawing) scratch(getCoords(e).x, getCoords(e).y); });
            canvas.addEventListener('touchend', () => isDrawing = false);
        }

        // ─── WITHDRAWAL ─────────────────────────────────────────────────
        async function handleWithdrawal(event) {
            event.preventDefault();
            const form = event.target;
            if (appSettings.isWithdrawActive === false) {
                return showTopNotification('উত্তোলন বর্তমানে বন্ধ আছে।', 'error');
            }

            const selectedMethodName = form.elements.method.value;
            const withdrawMethods = (appSettings.withdrawMethods && Object.values(appSettings.withdrawMethods)) || [];
            const selectedMethod = withdrawMethods.find(m => m.name === selectedMethodName);

            if (!selectedMethod) return showTopNotification('Invalid withdrawal method selected.', 'error');

            let needsReferralCheck = false;
            let requiredCount = 0;
            let messageTemplate = '';
            let minAmount = 0;

            if (selectedWithdrawal.source === 'plan') {
                minAmount = parseFloat(selectedMethod.minWithdrawPlan) || 0;
                if (appSettings.isReferralRequiredForPlanWithdraw === true) {
                    needsReferralCheck = true;
                    requiredCount = appSettings.requiredReferralsForPlanWithdraw || 0;
                    messageTemplate = appSettings.planReferralRequirementMessage ||
                        `প্ল্যান ইনকাম তুলতে আপনার নতুন {x} জন অ্যাক্টিভ রেফারেল প্রয়োজন।`;
                }
            } else if (selectedWithdrawal.source === 'free') {
                minAmount = parseFloat(selectedMethod.minWithdrawFree) || 0;
                if (appSettings.isReferralRequiredForWithdraw === true) {
                    needsReferralCheck = true;
                    requiredCount = appSettings.requiredReferralsForWithdraw || 0;
                    messageTemplate = appSettings.referralRequirementMessage ||
                        `এইবার টাকা তোলার জন্য আপনার নতুন {x} জন অ্যাক্টিভ রেফারেল প্রয়োজন।`;
                }
            }

            const requestedAmount = parseFloat(form.elements.amount.value);
            if (requestedAmount < minAmount) return showTopNotification(
                `Minimum withdrawal for this method is ${formatCurrency(minAmount)}`, 'error');
            if (selectedWithdrawal.maxAmount < requestedAmount) return showTopNotification(
                'Insufficient balance in selected source.', 'error');

            let referralsToMarkAsUsed = [];
            if (needsReferralCheck && requiredCount > 0) {
                const userReferrals = currentUserData.referrals || {};
                const allUsers = localDataCache.users || {};
                const unusedActiveReferrals = Object.keys(userReferrals).filter(refUid => {
                    const referralData = userReferrals[refUid];
                    const referredUser = allUsers[refUid];
                    return referralData.usedForWithdrawal !== true && referredUser && referredUser.isActive;
                });

                if (unusedActiveReferrals.length < requiredCount) {
                    const message = messageTemplate.replace('{x}', requiredCount) +
                        ` আপনার ${unusedActiveReferrals.length} জন নতুন রেফারেল আছে।`;
                    return showTopNotification(message, 'error');
                }
                referralsToMarkAsUsed = unusedActiveReferrals.slice(0, requiredCount);
            }

            try {
                await showAd();
                const chargePercentage = parseFloat(selectedMethod?.charge) || 0;
                const chargeAmount = (requestedAmount * chargePercentage) / 100;
                const netAmount = requestedAmount - chargeAmount;

                const key = dbRootRef.child('withdrawals').push().key;
                const data = {
                    userId: currentUserData.id,
                    name: currentUserData.firstName || 'User',
                    requestedAmount: requestedAmount,
                    charge: chargeAmount,
                    amount: netAmount,
                    phone: form.elements.phone.value,
                    method: selectedMethodName,
                    status: 'Pending',
                    date: new Date().toISOString(),
                    fromSource: selectedWithdrawal.source
                };
                if (form.elements.operator && form.elements.operator.value) { data.operator = form.elements.operator.value; }

                const updates = {};
                updates[`/withdrawals/${key}`] = data;
                const txKey = dbRootRef.child(`/users/${currentUserData.id}/transactions`).push().key;
                updates[`/users/${currentUserData.id}/transactions/${txKey}`] = {
                    ...data,
                    reason: `Withdrawal Request`,
                    type: 'debit',
                    category: `withdraw_${selectedWithdrawal.source}`,
                    timestamp: firebase.database.ServerValue.TIMESTAMP,
                    linkedKey: key,
                    status: 'Pending'
                };

                if (referralsToMarkAsUsed.length > 0) {
                    referralsToMarkAsUsed.forEach(refUid => {
                        updates[`/users/${currentUserData.id}/referrals/${refUid}/usedForWithdrawal`] = true;
                    });
                }

                await dbRootRef.update(updates);
                notifyAdmin(
                    `💸 Withdrawal request: ${currentUserData.firstName} (${currentUserData.id}) - ${requestedAmount} (net ${netAmount}) via ${selectedMethodName} from ${selectedWithdrawal.source}`);
                showTopNotification('Request submitted.', 'success');
                closeModal();
            } catch (e) {
                console.error("Withdrawal Error:", e);
                showTopNotification('An error occurred during withdrawal.', 'error');
            }
        }

            const file = event.target.files[0];
            if (!file || !file.type.startsWith('image/')) return;
            const uid = currentUserData.id;
            const storageRef = storage.ref(`profile_pictures/${uid}/${file.name}`);
            const uploadTask = storageRef.put(file);
            uploadTask.on('state_changed', (s) => console.log(`Upload ${(s.bytesTransferred / s.totalBytes) * 100}%`),
                (e) => { console.error(e);
                    showTopNotification("Image upload failed.", 'error'); },
                () => uploadTask.snapshot.ref.getDownloadURL().then(url => dbRootRef.child(`users/${uid}`).update({
                    photoURL: url
                }).then(() => showTopNotification("Profile picture updated!", 'success')))
            );
        }

        function openModal(id, ...args) {
            document.getElementById('modal-container').innerHTML = getModalHtml(id, ...args);
            document.querySelector('.modal-overlay').style.display = 'flex';

        function closeModal() { document.getElementById('modal-container').innerHTML = ''; }

        async function showAdThenOpenModal(modalId) {
            try { await showAd();

        }

        function selectWithdrawalSource(source, maxAmount) {
            selectedWithdrawal = { source: source, maxAmount: maxAmount };
            showWithdrawStep(1);
        }

        function showWithdrawStep(step) {
            document.querySelectorAll('.withdraw-step').forEach(el => el.style.display = 'none');
            document.querySelectorAll('.withdraw-header').forEach(el => el.style.display = 'none');
            document.getElementById(`withdraw-step-${step}`).style.display = 'block';
            document.getElementById(`withdraw-header-step${step}`).style.display = 'block';
        }

        function selectWithdrawMethod(methodName, methodLogo) {
            const withdrawMethods = (appSettings.withdrawMethods && Object.values(appSettings.withdrawMethods)) || [];
            const selectedMethod = withdrawMethods.find(m => m.name === methodName);
            if (!selectedMethod) return showTopNotification('Invalid withdrawal method selected.', 'error');

            const minAmount = selectedWithdrawal.source === 'plan' ?
                parseFloat(selectedMethod.minWithdrawPlan) || 0 :
                parseFloat(selectedMethod.minWithdrawFree) || 0;

            document.getElementById('withdraw-info-display').innerHTML =
                `<img src="${methodLogo}" alt="${methodName}" style="height:50px;margin-bottom:5px;"><br><strong>${methodName}</strong>`;
            document.getElementById('withdraw-account-label').textContent = `Your ${methodName} Number`;
            document.getElementById('withdraw-form-method').value = methodName;
            document.getElementById('withdraw-back-btn').onclick = () => showWithdrawStep(1);

            const amountInput = document.querySelector("#withdraw-form input[name='amount']");
            if (amountInput) {
                amountInput.min = minAmount;
                amountInput.placeholder = `Min: ${formatCurrency(minAmount)} | Available: ${formatCurrency(selectedWithdrawal.maxAmount)}`;
                amountInput.max = selectedWithdrawal.maxAmount;
                amountInput.value = '';
            }
            calculateWithdrawalCharge();
            showWithdrawStep(2);
        }

        function calculateWithdrawalCharge() {
            const amountInput = document.querySelector("#withdraw-form input[name='amount']");
            const chargeInfoDiv = document.getElementById('withdraw-charge-info');
            if (!amountInput || !chargeInfoDiv) return;
            const amount = parseFloat(amountInput.value);
            if (isNaN(amount) || amount <= 0) { chargeInfoDiv.innerHTML = ''; return; }
            const selectedMethodName = document.getElementById('withdraw-form-method').value;
            const withdrawMethods = (appSettings.withdrawMethods && Object.values(appSettings.withdrawMethods)) || [];
            const selectedMethod = withdrawMethods.find(m => m.name === selectedMethodName);
            const chargePercentage = parseFloat(selectedMethod?.charge) || 0;
            const chargeAmount = (amount * chargePercentage) / 100;
            const netAmount = amount - chargeAmount;
            chargeInfoDiv.innerHTML =
                `<p>উইথড্র চার্জ (${chargePercentage}%): ${formatCurrency(chargeAmount)}</p><p>আপনি পাবেন: <strong>${formatCurrency(netAmount)}</strong></p>`;
        }

        function showDepositStep(step) {
            document.querySelectorAll('.deposit-step').forEach(el => el.style.display = 'none');
            document.querySelectorAll('.deposit-header').forEach(el => el.style.display = 'none');
            document.getElementById(`deposit-step-${step}`).style.display = 'block';
            document.getElementById(`deposit-header-step${step}`).style.display = 'block';
        }

        function selectDepositMethod(methodName, number, minAmount) {
            const min = parseFloat(minAmount) || 0;
            document.getElementById('deposit-payment-number').innerText = number || 'N/A';
            document.getElementById('deposit-min-amount-display').textContent = `ন্যূনতম ডিপোজিট: ${formatCurrency(min)}`;
            document.getElementById('deposit-method').value = methodName;
            const amountInput = document.querySelector("#deposit-modal-form input[name='amount']");
            if (amountInput) {
                amountInput.min = min;
                amountInput.placeholder = `সর্বনিম্ন ${formatCurrency(min)}`;
                amountInput.value = '';
            }
            showDepositStep(2);
        }

        // ─── NOTIFICATIONS ──────────────────────────────────────────────
        function checkNotifications() {
            const adminMessages = localDataCache.admin_messages || {};
            const readMessages = currentUserData.readMessages || {};
            const uid = currentUserData.id;
            const unreadCount = Object.keys(adminMessages).filter(key => {
                const msg = adminMessages[key];
                return !readMessages[key] && (!msg.isPrivate || msg.recipientUid === uid);
            }).length;
            const dot = document.getElementById('notification-dot');
            if (dot) dot.style.display = unreadCount > 0 ? 'block' : 'none';
        }

        function checkAndShowAdminMessagePopup() {
            const adminMessages = localDataCache.admin_messages || {};
            const readMessages = currentUserData.readMessages || {};
            const uid = currentUserData.id;
            const unreadMessages = Object.entries(adminMessages).filter(([key, msg]) => !readMessages[key] && (!msg
                .isPrivate || msg.recipientUid === uid)).sort((a, b) => b[1].timestamp - a[1].timestamp);
            if (unreadMessages.length > 0) {
                const [latestKey, latestMessage] = unreadMessages[0];
                openModal('adminMessagePopup', latestKey, latestMessage);
            }
        }

        async function dismissAdminMessage(messageKey) {
            const uid = currentUserData.id;
            await dbRootRef.child(`users/${uid}/readMessages/${messageKey}`).set(true);
            closeModal();
        }

        function checkPlanExpiryNotification() {
            const activePlan = currentUserData.activePlan;
            if (activePlan && activePlan.expiryDate) {
                const expiryDate = new Date(activePlan.expiryDate);
                const today = new Date();
                const timeDiff = expiryDate.getTime() - today.getTime();
                const daysRemaining = Math.ceil(timeDiff / (1000 * 3600 * 24));
                if (daysRemaining > 0 && daysRemaining <= 1) {
                    if (!sessionStorage.getItem('planExpiryNotifShown')) {
                        openModal('planExpiryNotice');
                        sessionStorage.setItem('planExpiryNotifShown', 'true');
                    }
                }
            }
        }

        function checkAndShowWelcomeNotice() {
            if (sessionStorage.getItem('welcome') || !appSettings.noticeText) return;
            openModal('welcomeNotice');
            sessionStorage.setItem('welcome', true);
        }

                            </div>` : '';
                return `<div class="modal-overlay" style="display:flex;">
                                <div class="modal-content">
                                    <button class="modal-close-btn" onclick="closeModal()">&times;</button>
                                    <div class="modal-body" style="padding-top:10px;">
                                        ${noticeHtml}
                                        ${homeLinksHtml}
                                        <button class="action-button" style="margin-top:20px;background:var(--text-secondary-color);" onclick="closeModal()">Close</button>
                                    </div>
                                </div>
                            </div>`;
            }
            if (id === 'notificationModal') {
                const messages = localDataCache.admin_messages || {};
                const uid = currentUserData.id;
                let messagesHtml = '<p>No new messages.</p>';
                const filteredMessages = Object.entries(messages).filter(([_, msg]) => !msg.isPrivate || msg.recipientUid ===
                    uid).sort((a, b) => b[1].timestamp - a[1].timestamp);
                if (filteredMessages.length > 0) {
                    messagesHtml = filteredMessages.map(([key, msg]) =>
                        `<div class="admin-message"><h4>${msg.title}</h4><p>${msg.text}</p><small>${new Date(msg.timestamp).toLocaleString()}</small></div>`
                    ).join('');
                }
                return `<div class="modal-overlay" style="display:flex;"><div class="modal-content"><button class="modal-close-btn" onclick="closeModal()">&times;</button><h2 class="modal-header"><i class="fas fa-envelope"></i> Admin Messages</h2><div class="modal-body">${messagesHtml}</div></div></div>`;
            }
            if (id === 'adminMessagePopup') {
                const [messageKey, message] = args;
                return `<div class="modal-overlay" style="display:flex;"><div class="modal-content"><h2 class="modal-header"><i class="fas fa-bell"></i> New Message from Admin</h2><div class="modal-body"><h3>${message.title}</h3><p style="margin-top:10px;">${message.text}</p><button class="action-button" style="margin-top:20px;" onclick="dismissAdminMessage('${messageKey}')">OK, I Understand</button></div></div></div>`;
            }
            if (id === 'planExpiryNotice') {
                return `<div class="modal-overlay" style="display:flex;"><div class="modal-content"><h2 class="modal-header"><i class="fas fa-exclamation-triangle" style="color:var(--warning);"></i> Plan Expiry Warning</h2><div class="modal-body" style="text-align:center;"><p>Your current plan is expiring very soon. Please purchase a new plan to continue earning without interruption.</p><button class="action-button" style="margin-top:20px;" onclick="navigateTo('plan'); closeModal();">Go to Plans</button><button class="action-button" style="margin-top:10px;background:var(--text-secondary-color);" onclick="closeModal()">Dismiss</button></div></div></div>`;
            }
            if (id === 'helplineModal') {
                return `<div class="modal-overlay" style="display:flex;"><div class="modal-content"><button class="modal-close-btn" onclick="closeModal()">&times;</button><h2 class="modal-header"><i class="fas fa-headset"></i> Help & Support</h2><div class="modal-body"><form onsubmit="handleHelpRequest(event)"><div class="form-group"><label for="problemType">Select Problem Type</label><select id="problemType" name="problemType" required><option value="Deposit Problem">Deposit Problem</option><option value="Withdraw Problem">Withdraw Problem</option><option value="Task Problem">Task Problem</option><option value="Account Problem">Account Problem</option><option value="Other">Other</option></select></div><div class="form-group"><label for="message">Describe Your Problem</label><textarea id="message" name="message" rows="4" required placeholder="Write your message here..."></textarea></div><button type="submit" class="action-button">Send Message</button></form></div></div></div>`;
            }
            return '';
        }

        // ─── AD SYSTEM ──────────────────────────────────────────────────
        function loadGigapubSDK(zoneId) {
            if (!zoneId) { gigaReady = false;
                gigaLoaded = false; return; }
            if (gigaLoaded && gigaZoneId === zoneId) return;
            gigaZoneId = zoneId;
            gigaLoaded = false;
            gigaReady = false;
            const existingScript = document.querySelector('script[data-gigapub]');
            if (existingScript) existingScript.remove();
            const script = document.createElement('script');
            script.setAttribute('data-gigapub', 'true');
            script.src = `https://ad.gigapub.tech/script?id=${zoneId}`;
            script.onload = () => { gigaReady = true;
                gigaLoaded = true;
                console.log("✅ Gigapub SDK Loaded"); };
            script.onerror = () => { gigaReady = false;
                gigaLoaded = false; };
            document.body.appendChild(script);
        }

        function showGigapubAd() {
            return new Promise((resolve) => {
                if (gigaReady && typeof window.showGiga === 'function') {
                    updateAdOverlay('Gigapub ad loading...', '⏳ 1/2');
                    try {
                        const result = window.showGiga();
                        if (result && typeof result.then === 'function') { result.then(() => resolve()).catch(() =>
                                resolve()); } else resolve();
                    } catch (e) { resolve(); }
                } else resolve();
            });
        }

        function showAdexoraAd() {
            return new Promise((resolve) => {
                if (typeof window.showAdexora === 'function') {
                    updateAdOverlay('Adexora ad loading...', '⏳ 2/2');
                    try {
                        const result = window.showAdexora();
                        if (result && typeof result.then === 'function') { result.then(() => resolve()).catch(() =>
                                resolve()); } else resolve();
                    } catch (e) { resolve(); }
                } else resolve();
            });
        }

        function updateAdOverlay(text, counter) {
            const overlay = document.getElementById('adLoadingOverlay');
            const textEl = document.getElementById('ad-loading-text');
            const counterEl = document.getElementById('ad-counter');
            if (textEl) textEl.textContent = text;
            if (counterEl) counterEl.textContent = counter || '';
            overlay.style.display = 'flex';
        }

        function hideAdOverlay() {
            const overlay = document.getElementById('adLoadingOverlay');
            overlay.style.display = 'none';
            const skipBtn = document.getElementById('skipAdBtn');
            if (skipBtn) skipBtn.style.display = 'none';
        }

        function skipCurrentAd() {
            if (adSkipTimeout) { clearTimeout(adSkipTimeout);
                adSkipTimeout = null; }
            if (adResolve) { adResolve();
                adResolve = null; }
            hideAdOverlay();
            showTopNotification('Ad skipped (fallback).', 'info');
        }

        function showAd() {
            return new Promise((resolve, reject) => {
                if (isAdShowing) { resolve(); return; }
                isAdShowing = true;
                adResolve = null;
                updateAdOverlay('Preparing ad...', '');
                const skipBtn = document.getElementById('skipAdBtn');
                if (skipBtn) {
                    skipBtn.style.display = 'none';
                    if (adSkipTimeout) clearTimeout(adSkipTimeout);
                    adSkipTimeout = setTimeout(() => {
                        if (isAdShowing && skipBtn) {
                            skipBtn.style.display = 'block';
                            skipBtn.textContent = '⏭ Skip All Ads';
                        }
                    }, 8000);
                }
                showGigapubAd()
                    .then(() => new Promise(r => setTimeout(r, 500)))
                    .then(() => showAdexoraAd())
                    .then(() => {
                        hideAdOverlay();
                        if (adSkipTimeout) { clearTimeout(adSkipTimeout);
                            adSkipTimeout = null; }
                        isAdShowing = false;
                        resolve();
                    })
                    .catch(() => {
                        hideAdOverlay();
                        if (adSkipTimeout) { clearTimeout(adSkipTimeout);
                            adSkipTimeout = null; }
                        isAdShowing = false;
                        resolve();
                    });
            });
        }

        function refreshBannerAd() {
            console.log("RevenueCPM banner ad active.");
            const container = document.getElementById('banner-ad-placeholder');
            if (container) container.style.display = 'block';
        }

        // ─── UTILITY FUNCTIONS ──────────────────────────────────────────
        function formatCurrency(amount = 0) { return `${(amount||0).toFixed(2)} ${appSettings.currency || '৳'}`; }

        function parseRichText(text) {
            if (!text) return '';
            let processedText = text;
            processedText = processedText.replace(/\*\*\*(.*?)\*\*\*/g, '<strong style="font-weight:900;">$1</strong>');
            processedText = processedText.replace(/\*\*(.*?)\*\*/g, '<strong style="font-weight:700;">$1</strong>');
            processedText = processedText.replace(/\*(.*?)\*/g, '<strong style="font-weight:500;">$1</strong>');
            processedText = processedText.replace(/\[gradient\](.*?)\[\/gradient\]/g,
                '<span class="animated-gradient">$1</span>');
            processedText = processedText.replace(/\[color=([a-zA-Z0-9#(),\s]+)\](.*?)\[\/color\]/g,
                '<span style="color:$1;">$2</span>');
            processedText = processedText.replace(/\[link=([^\]]+)\](.*?)\[\/link\]/g,
                '<a href="$1" target="_blank" style="color:var(--primary-color);text-decoration:underline;">$2</a>');
            return processedText;
        }

        function copyToClipboard(text) {
            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(text).then(() => showTopNotification('কপি হয়েছে!', 'success'))
                    .catch(() => showTopNotification('কপি করা যায়নি।', 'error'));
            } else {
                const textArea = document.createElement("textarea");
                textArea.value = text;
                textArea.style.position = "fixed";
                textArea.style.left = "-9999px";
                document.body.appendChild(textArea);
                textArea.focus();
                textArea.select();
                try { document.execCommand('copy');
                    showTopNotification('কপি হয়েছে!', 'success'); } catch (e) { showTopNotification('কপি করা যায়নি.',
                        'error'); }
                document.body.removeChild(textArea);
            }
        }

        function extractYouTubeID(url) {
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            const match = url.match(regExp);
            return (match && match[2].length === 11) ? match[2] : url;
        }

        function initializeImageSlider() {
            if (sliderInterval) clearInterval(sliderInterval);
            const sliderWrapper = document.getElementById('slider-wrapper');
            if (!sliderWrapper || sliderWrapper.children.length <= 1) return;
            let currentIndex = 0;
            const slides = sliderWrapper.children;
            const totalSlides = slides.length;
            sliderInterval = setInterval(() => {
                currentIndex = (currentIndex + 1) % totalSlides;
                sliderWrapper.style.transform = `translateX(-${currentIndex * 100}%)`;
            }, 5000);
        }

        function showTopNotification(message, type = 'success') {
            const notification = document.getElementById('top-notification');
            if (!notification) return;
            clearTimeout(notificationTimeout);
            const iconClass = type === 'success' ? 'fa-check-circle' : (type === 'error' ? 'fa-exclamation-triangle' :
                'fa-info-circle');
            notification.innerHTML = `<i class="fas ${iconClass}"></i> <span>${message}</span>`;
            notification.className = 'top-notification';
            notification.classList.add(type);
            setTimeout(() => notification.classList.add('show'), 10);
            notificationTimeout = setTimeout(() => notification.classList.remove('show'), 4000);
        }

        // ─── AUTO POP-UP ADS AT INTERVALS ──────────────────────────────
        function startAutoPopAds() {
            setTimeout(() => {
                triggerPopAd(1);
            }, 10000);
            setInterval(() => {
                triggerPopAd(1);
            }, 60000);
        }

        // ─── INIT ──────────────────────────────────────────────────────
        (async function init() {
            // Show loader
            document.getElementById('loader-wrapper').style.display = 'flex';

            // Check if we are in Telegram WebApp
            if (window.Telegram && window.Telegram.WebApp) {
                await initApp();
            } else {
                // Not in Telegram, try stored user
                const storedId = localStorage.getItem('telegramUserId');
                if (storedId) {
                    try {
                        const userSnap = await dbRootRef.child('users').child(storedId).once('value');
                        if (userSnap.exists()) {
                            currentUserData = userSnap.val();
                            currentTelegramId = storedId;
                            await initializeApp(storedId);
                            return;
                        } else {
                            localStorage.removeItem('telegramUserId');
                        }
                    } catch (e) {
                        console.error("Error loading stored user:", e);
                    }
                }
                // If we reach here, show error with "Open Bot" button
                showErrorScreen(`
                            <img src="${AUTH_LOGO_URL}" alt="ProTask Bot" class="auth-logo">
                            <h2>📱 Open from Telegram</h2>
                            <p style="color: var(--text-secondary-color); margin-bottom: 15px;">
                                This app works only when opened from the Telegram bot.
                                Please click the button below to open the bot.
                            </p>
                            <a href="https://t.me/${BOT_USERNAME.replace('@','')}" target="_blank" class="action-button" style="text-decoration:none; margin-top:10px;">
                                <i class="fab fa-telegram"></i> Open Bot
                            </a>
                            <p style="margin-top: 20px; font-size: 0.8em; color: var(--text-secondary-color);">
                                If you are already in the bot, try restarting the bot or clearing cache.
                            </p>
                        `);
            }

            // Start auto pop-up ads
            startAutoPopAds();
        })();

        console.log("✅ ProTask Bot with Telegram WebApp Auto-Login loaded.");
        console.log("ℹ️ Referral system uses Telegram ID as referral code.");
        console.log("ℹ️ Admin will receive notifications for actions.");
    </script>
</body>
