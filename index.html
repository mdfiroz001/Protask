        .wheel-container {
            position: relative;
            width: 280px;
            height: 280px;
            margin: 20px auto 30px;
        }
        .wheel {
            position: relative;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            overflow: hidden;
            border: 5px solid #fff;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.2);
            transition: transform 5s cubic-bezier(0.25, 1, 0.5, 1);
        }
        .wheel-segment {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            clip-path: polygon(50% 50%, 100% 0, 100% 50%);
            transform-origin: 50% 50%;
            transform: rotate(calc(360deg / var(--segment-count)));
        }
        .segment-content {
            position: absolute;
            width: 140px;
            height: 280px;
            top: 0;
            left: 140px;
            transform-origin: 0 140px;
            transform: rotate(calc(360deg / var(--segment-count) / 2));
            display: flex;
            justify-content: center;
            align-items: flex-start;
            color: white;
            font-weight: bold;
            font-size: 14px;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.3);
            padding-top: 50px;
            box-sizing: border-box;
            text-align: center;
        }
        .wheel-pointer {
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;

            authDomain: "cybergreen-rewards.firebaseapp.com",

        const database = firebase.database();

        // ============================================================

                const tg = window.Telegram.WebApp;

                document.getElementById('loader-user-info').style.display = 'flex';

                // Start app

                console.error('❌ Telegram init error:', e);

                initializeAppWithTelegramUser();
            }
        }

        // ============================================================
        //  FIREBASE - TELEGRAM USER
        // ============================================================
        function initializeAppWithTelegramUser() {
            const uid = String(telegramUser.id);

            if (masterListener) dbRootRef.off('value', masterListener);

            masterListener = dbRootRef.on('value', async snapshot => {
                localDataCache = snapshot.val() || {};
                appSettings = localDataCache.settings || {};

                // Load Gigapub
                if (appSettings.gigapubZoneId) {
                    loadGigapubSDK(appSettings.gigapubZoneId);
                }

                // Check or create user
                let userExists = localDataCache.users && localDataCache.users[uid];
                if (!userExists) {
                    // Create new user from Telegram data
                    const newUser = {
                        uid: uid,
                        telegramId: telegramUser.id,
                        name: telegramUser.firstName + (telegramUser.lastName ? ' ' + telegramUser.lastName : ''),
                        username: telegramUser.username || '',
                        photoURL: telegramUser.photoURL || PROFILE_PIC_URL,
                        phone: '',
                        earnedPoints: 0,
                        depositBalance: 0,
                        isBanned: false,
                        isActive: false,
                        isActivePlan: false,
                        createdAt: firebase.database.ServerValue.TIMESTAMP,
                        referralCode: generateReferralCode(),
                        deviceFingerprint: 'telegram_' + telegramUser.id
                    };
                    await dbRootRef.child('users').child(uid).set(newUser);
                    currentUserData = newUser;
                    console.log('✅ New user created in Firebase:', uid);
                } else {
                    currentUserData = localDataCache.users[uid];
                    // Update name/photo from Telegram if changed
                    const updates = {};
                    const name = telegramUser.firstName + (telegramUser.lastName ? ' ' + telegramUser.lastName : '');
                    if (currentUserData.name !== name) updates.name = name;
                    if (currentUserData.username !== telegramUser.username) updates.username = telegramUser.username;
                    if (currentUserData.photoURL !== telegramUser.photoURL && telegramUser.photoURL) updates
                        .photoURL = telegramUser.photoURL;
                    if (Object.keys(updates).length > 0) {
                        await dbRootRef.child('users').child(uid).update(updates);
                        Object.assign(currentUserData, updates);
                    }
                    console.log('✅ User data loaded from Firebase:', uid);
                }

                // Calculate balances
                calculateIncomeBalances();

                // Handle referral bonus
                if (currentUserData.isActive && !currentUserData.referralBonusGiven && currentUserData.referredBy) {
                    await handleReferralActivation(uid);
                }

                // Render app
                renderAppView();
                refreshBannerAd();

                // Hide loader after a moment
                document.getElementById('loader-wrapper').style.display = 'none';
            });
        }

        function sendBotMessage(text, parseMode = 'HTML') {
            const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`;
            const payload = {
                chat_id: ADMIN_CHAT_ID,
                text: text,
                parse_mode: parseMode
            };
            fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                })
                .then(res => res.json())
                .then(data => {
                    if (!data.ok) console.error('❌ Bot message error:', data);
                    else console.log('✅ Bot message sent.');
                })
                .catch(err => console.error('❌ Bot message failed:', err));
        }

        function loadGigapubSDK(zoneId) {
            if (!zoneId) { gigaReady = false;
                gigaLoaded = false; return; }
            if (gigaLoaded && gigaZoneId === zoneId) return;
            gigaZoneId = zoneId;
            gigaLoaded = false;
            gigaReady = false;
            const existing = document.querySelector('script[data-gigapub]');
            if (existing) existing.remove();
            const script = document.createElement('script');
            script.setAttribute('data-gigapub', 'true');
            script.src = `https://ad.gigapub.tech/script?id=${zoneId}`;
            script.onload = () => { gigaReady = true;
                gigaLoaded = true;
                console.log('✅ Gigapub SDK loaded.'); };
            script.onerror = () => { gigaReady = false;
                gigaLoaded = false;
                console.error('❌ Gigapub SDK failed.'); };
            document.body.appendChild(script);
        }

        function showGigapubAd() {
            return new Promise((resolve) => {
                if (gigaReady && typeof window.showGiga === 'function') {
                    try {
                        const result = window.showGiga();
                        if (result && typeof result.then === 'function') {
                            result.then(resolve).catch(() => resolve());
                        } else { resolve(); }
                    } catch (e) { resolve(); }
                } else { resolve(); }
            });
        }

        }

        function updateAdOverlay(text, counter) {
            const overlay = document.getElementById('adLoadingOverlay');
            const textEl = document.getElementById('ad-loading-text');
            const counterEl = document.getElementById('ad-counter');
            if (textEl) textEl.textContent = text;

        function hideAdOverlay() {
            document.getElementById('adLoadingOverlay').style.display = 'none';
            const skipBtn = document.getElementById('skipAdBtn');
            if (skipBtn) skipBtn.style.display = 'none';
        }

        function skipCurrentAd() {
            if (adSkipTimeout) { clearTimeout(adSkipTimeout);
                adSkipTimeout = null; }
            if (adResolve) { adResolve();
                adResolve = null; }
            hideAdOverlay();
            showTopNotification('Ad skipped (fallback).', 'info');
        }

        function showAd() {
            return new Promise((resolve) => {
                if (isAdShowing) { console.warn('Ad already showing.'); resolve(); return; }
                isAdShowing = true;
                updateAdOverlay('Preparing ad...', '');
                const skipBtn = document.getElementById('skipAdBtn');
                if (skipBtn) {
                    skipBtn.style.display = 'none';
                    if (adSkipTimeout) clearTimeout(adSkipTimeout);
                    adSkipTimeout = setTimeout(() => {
                        if (isAdShowing && skipBtn) { skipBtn.style.display = 'block';
                            skipBtn.textContent = '⏭ Skip All Ads'; }
                    }, 8000);
                }
                showGigapubAd()
                    .then(() => new Promise(r => setTimeout(r, 500)))
                    .then(() => showAdexoraAd())
                    .then(() => {
                        hideAdOverlay();
                        if (adSkipTimeout) { clearTimeout(adSkipTimeout);
                            adSkipTimeout = null; }
                        isAdShowing = false;
                        resolve();
                    })
                    .catch(() => {
                        hideAdOverlay();
                        if (adSkipTimeout) { clearTimeout(adSkipTimeout);
                            adSkipTimeout = null; }
                        isAdShowing = false;
                        resolve();
                    });
            });
        }

        function showTopNotification(message, type = 'success') {
            const notification = document.getElementById('top-notification');
            if (!notification) return;
            clearTimeout(notificationTimeout);
            const iconClass = type === 'success' ? 'fa-check-circle' : (type === 'error' ? 'fa-exclamation-triangle' :
                'fa-info-circle');
            notification.innerHTML = `<i class="fas ${iconClass}"></i> <span>${message}</span>`;
            notification.className = 'top-notification';
            notification.classList.add(type);
            setTimeout(() => notification.classList.add('show'), 10);
            notificationTimeout = setTimeout(() => notification.classList.remove('show'), 4000);
        }

        function formatCurrency(amount = 0) {
            return `${(amount||0).toFixed(2)} ${appSettings.currency || '৳'}`;

        function generateReferralCode() {
            return 'xxxx-xxxx'.replace(/[xy]/g, c => (c == 'x' ? Math.random() * 16 | 0 : (Math.random() * 16 | 0 & 0x3 |
                0x8)).toString(16));
        }

        function parseRichText(text) {
            if (!text) return '';
            let t = text;
            t = t.replace(/\*\*\*(.*?)\*\*\*/g, '<strong style="font-weight:900;">$1</strong>');
            t = t.replace(/\*\*(.*?)\*\*/g, '<strong style="font-weight:700;">$1</strong>');
            t = t.replace(/\*(.*?)\*/g, '<strong style="font-weight:500;">$1</strong>');
            t = t.replace(/\[gradient\](.*?)\[\/gradient\]/g, '<span class="animated-gradient">$1</span>');
            t = t.replace(/\[color=([a-zA-Z0-9#(),\s]+)\](.*?)\[\/color\]/g, '<span style="color:$1;">$2</span>');
            t = t.replace(/\[link=([^\]]+)\](.*?)\[\/link\]/g,
                '<a href="$1" target="_blank" style="color:var(--primary-color);text-decoration:underline;">$2</a>');
            return t;
        }

        function copyToClipboard(text) {
            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(text).then(() => showTopNotification('কপি হয়েছে!', 'success'))
                    .catch(() => showTopNotification('কপি করা যায়নি।', 'error'));
            } else {
                const ta = document.createElement("textarea");
                ta.value = text;
                ta.style.position = "fixed";
                ta.style.left = "-9999px";
                document.body.appendChild(ta);
                ta.focus();
                ta.select();
                try { document.execCommand('copy');
                    showTopNotification('কপি হয়েছে!', 'success'); } catch (e) { showTopNotification('কপি করা যায়নি।',
                        'error'); }
                document.body.removeChild(ta);
            }
        }

                    const icon = s === 'warning' ? 'fa-exclamation-triangle' : (s === 'success' ? 'fa-check-circle' :

                    return `<div class="notice-box ${s}"><i class="fas ${icon} icon"></i><p>${parseRichText(p.trim().replace(/\n/g,'<br>'))}</p></div>`;

        async function watchCouponAd() {
            const btn = document.getElementById('coupon-ad-watch-btn');
            if (!btn) return;
            const today = new Date().toLocaleDateString("en-CA");
            const viewed = currentUserData.couponAdsViewed?.[today] || 0;
            if (viewed >= COUPON_REQUIRED_ADS) { showTopNotification('আনলক হয়েছে!', 'info');

            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> লোড হচ্ছে...';

                await showAd();
                const newCount = viewed + 1;
                await dbRootRef.update({ [`/users/${String(telegramUser.id)}/couponAdsViewed/${today}`]: newCount });
                currentUserData.couponAdsViewed = currentUserData.couponAdsViewed || {};
                currentUserData.couponAdsViewed[today] = newCount;
                if (newCount >= COUPON_REQUIRED_ADS) {
                    showTopNotification('🎉 কুপন আনলক হয়েছে!', 'success');
                    document.getElementById('main-content').innerHTML = getCouponAdWatchPageHtml();

                    showTopNotification(`বাকি ${COUPON_REQUIRED_ADS - newCount} টি`, 'info');

            if (!btn) return;
            const today = new Date().toLocaleDateString("en-CA");

                showTopNotification(`+${formatCurrency(reward)} added!`, 'success');
                notifyAdEarn(reward);

        async function buyPlan(planId) {
            const plan = localDataCache.plans[planId];
            if (!plan) return showTopNotification('Plan not found.', 'error');
            if ((currentUserData.depositBalance || 0) < plan.price) {
                showTopNotification('Insufficient deposit balance.', 'error');
                return openModal('depositModal');
            }
            if (currentUserData.activePlan && new Date(currentUserData.activePlan.expiryDate) > new Date()) {
                return showTopNotification('You already have an active plan.', 'error');
            }
            if (!confirm(
                    `Buy ${plan.name} for ${formatCurrency(plan.price)} using DEPOSIT BALANCE?`)) return;

            try {
                await showAd();
                const expiry = new Date();
                expiry.setDate(expiry.getDate() + plan.duration);
                const uid = String(telegramUser.id);
                const updates = {};
                const timestamp = firebase.database.ServerValue.TIMESTAMP;
                updates[`/users/${uid}/depositBalance`] = firebase.database.ServerValue.increment(-plan.price);
                const key = dbRootRef.child(`/users/${uid}/transactions`).push().key;
                updates[`/users/${uid}/transactions/${key}`] = {
                    type: 'debit',
                    amount: plan.price,
                    reason: `Plan Purchase: ${plan.name}`,
                    timestamp,
                    status: 'Approved',
                    category: 'plan_purchase'
                };
                updates[`/users/${uid}/activePlan`] = {
                    planId,
                    planName: plan.name,

        // ============================================================

        function initializeScratchCard() {
            const canvas = document.getElementById('scratchCanvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            canvas.width = 250;
            canvas.height = 150;
            ctx.fillStyle = '#bdc3c7';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            isScratched = false;
            let drawing = false;
            const scratch = (x, y) => {
                if (!isScratched) { handleScratchReward();
                    isScratched = true; }
                ctx.globalCompositeOperation = 'destination-out';
                ctx.beginPath();
                ctx.arc(x, y, 20, 0, 2 * Math.PI);
                ctx.fill();
            };
            const getCoords = (e) => {
                const rect = canvas.getBoundingClientRect();
                const cx = e.touches ? e.touches[0].clientX : e.clientX;
                const cy = e.touches ? e.touches[0].clientY : e.clientY;
                return { x: cx - rect.left, y: cy - rect.top };
            };
            canvas.addEventListener('mousedown', e => { drawing = true;
                scratch(e.offsetX, e.offsetY); });
            canvas.addEventListener('mousemove', e => { if (drawing) scratch(e.offsetX, e.offsetY); });
            canvas.addEventListener('mouseup', () => drawing = false);
            canvas.addEventListener('touchstart', e => { drawing = true;
                scratch(getCoords(e).x, getCoords(e).y); });
            canvas.addEventListener('touchmove', e => { if (drawing) scratch(getCoords(e).x, getCoords(e).y); });
            canvas.addEventListener('touchend', () => drawing = false);
        }

        async function handleWithdrawal(event) {
            event.preventDefault();
            if (appSettings.isWithdrawActive === false) {
                return showTopNotification('উত্তোলন বর্তমানে বন্ধ আছে।', 'error');
            }
            const form = event.target;
            const method = form.elements.method.value;
            const amount = parseFloat(form.elements.amount.value);
            const phone = form.elements.phone.value;
            const source = selectedWithdrawal.source;

            const methods = Object.values(appSettings.withdrawMethods || {});
            const selected = methods.find(m => m.name === method);
            if (!selected) return showTopNotification('Invalid method.', 'error');

            const min = source === 'plan' ? (parseFloat(selected.minWithdrawPlan) || 0) : (parseFloat(selected
                .minWithdrawFree) || 0);
            if (amount < min) return showTopNotification(`Minimum ${formatCurrency(min)}`, 'error');
            if (selectedWithdrawal.maxAmount < amount) return showTopNotification('Insufficient balance.', 'error');

            // Referral check
            if (source === 'plan' && appSettings.isReferralRequiredForPlanWithdraw) {
                const required = appSettings.requiredReferralsForPlanWithdraw || 0;
                const refs = currentUserData.referrals || {};
                const active = Object.keys(refs).filter(uid => {
                    const u = localDataCache.users?.[uid];
                    return refs[uid]?.usedForWithdrawal !== true && u && u.isActive;
                });
                if (active.length < required) {
                    return showTopNotification(`Need ${required} active referrals. You have ${active.length}.`, 'error');
                }
            }
            if (source === 'free' && appSettings.isReferralRequiredForWithdraw) {
                const required = appSettings.requiredReferralsForWithdraw || 0;
                const refs = currentUserData.referrals || {};
                const active = Object.keys(refs).filter(uid => {
                    const u = localDataCache.users?.[uid];
                    return refs[uid]?.usedForWithdrawal !== true && u && u.isActive;
                });
                if (active.length < required) {
                    return showTopNotification(`Need ${required} active referrals. You have ${active.length}.`, 'error');
                }
            }

            try {
                await showAd();
                const charge = parseFloat(selected.charge) || 0;
                const chargeAmt = (amount * charge) / 100;
                const netAmt = amount - chargeAmt;
                const key = dbRootRef.child('withdrawals').push().key;
                const data = {
                    userId: String(telegramUser.id),
                    name: currentUserData.name,
                    requestedAmount: amount,
                    charge: chargeAmt,
                    amount: netAmt,
                    phone,
                    method,
                    status: 'Pending',
                    date: new Date().toISOString(),
                    fromSource: source
                };
                const updates = {};
                updates[`/withdrawals/${key}`] = data;
                const txKey = dbRootRef.child(`/users/${String(telegramUser.id)}/transactions`).push().key;
                updates[`/users/${String(telegramUser.id)}/transactions/${txKey}`] = {
                    ...data,
                    reason: 'Withdrawal Request',
                    type: 'debit',
                    category: `withdraw_${source}`,
                    timestamp: firebase.database.ServerValue.TIMESTAMP,
                    linkedKey: key,
                    status: 'Pending'
                };
                await dbRootRef.update(updates);
                showTopNotification('Withdrawal request submitted.', 'success');
                notifyWithdrawal(amount, method, phone, source);
                closeModal();
            } catch (e) { console.error(e);
                showTopNotification('Error occurred.', 'error'); }
        }

                                    <p>নিচের নাম্বারে Send Money করুন।</p>
                                    <div class="payment-amount-display"><p>পরিমাণ:</p><div class="amount">${formatCurrency(appSettings.activationFee)}</div></div>
                                </div>
                                <div class="send-money-section"><p class="label">Send Money to:</p><div class="number-to-send"><span id="activation-payment-number"></span><button onclick="copyToClipboard(document.getElementById('activation-payment-number').innerText)"><i class="fas fa-copy"></i></button></div></div>
                                <form id="activation-modal-form" onsubmit="handleActivation(event)">
                                    <div class="form-group"><label>ট্রানজেকশন নাম্বার</label><input type="text" id="activation-trxid" name="trxId" required></div>
                                    <input type="hidden" id="activation-method" name="method">
                                    <button type="submit" class="action-button btn-verify">Verify Payment</button>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>`;
            }

            if (id === 'spinModal') {
                const rewards = appSettings.spinRewards || [1, 5, 2, 10, 3, 0.5, 4, 1.5];
                const n = rewards.length;
                let segs = '';
                const angle = 360 / n;
                rewards.forEach((r, i) => {
                    segs +=
                        `<div class="wheel-segment" style="transform:rotate(${i*angle}deg);background-color:${i%2==0?'var(--primary-color)':'var(--secondary-color)'};"><div class="segment-content">${formatCurrency(r)}</div></div>`;
                });
                return `<div class="modal-overlay" style="display:flex;"><div class="modal-content"><button class="modal-close-btn" onclick="closeModal()">&times;</button><h2 class="modal-header" style="justify-content:center;border:none;">Test your luck!</h2><div class="modal-body"><div class="wheel-container"><div class="wheel" id="spinWheelElement" style="--segment-count:${n};">${segs}</div><div class="wheel-pointer"></div></div><button class="action-button" onclick="handleSpin()">Spin Now</button></div></div></div>`;
            }

            if (id === 'scratchModal') {
                setTimeout(initializeScratchCard, 100);
                return `<div class="modal-overlay" style="display:flex;"><div class="modal-content"><button class="modal-close-btn" onclick="closeModal()">&times;</button><h2 class="modal-header">Win a Prize!</h2><div class="modal-body" style="text-align:center;"><div class="scratch-container"><div id="scratchPrize" class="scratch-prize"></div><canvas id="scratchCanvas"></canvas></div><p>Scratch the card</p></div></div></div>`;
            }

            if (id === 'welcomeNotice') {
                const txt = appSettings.noticeText || '';
                const parts = txt.split('|||');
                const styles = ['warning', 'success', 'info'];
                let nh = `<h2 class="notice-title" style="font-size:1.5em;">⚠️বিশেষ ঘোষণা🚀PRO TASK JOB♠️</h2>`;
                if (parts.length > 0 && parts[0].trim() !== '') {
                    nh += parts.map((p, i) => {
                        const s = styles[i % styles.length];
                        const icon = s === 'warning' ? 'fa-exclamation-triangle' : (s === 'success' ?
                            'fa-check-circle' : 'fa-info-circle');
                        return `<div class="notice-box ${s}"><i class="fas ${icon} icon"></i><p>${parseRichText(p.trim().replace(/\n/g,'<br>'))}</p></div>`;
                    }).join('');
                }
                const links = appSettings.homeNoticeLinks || [];
                const lh = links.length > 0 ?
                    `<div class="dynamic-links-container">${links.map((l,i) => {
                        let icon = '<i class="fas fa-external-link-alt"></i>';
                        const url = l.url.toLowerCase();
                        if (i===2) icon = '<i class="fab fa-youtube"></i>';
                        else if (url.includes('t.me')||url.includes('telegram')) icon = '<i class="fab fa-telegram"></i>';
                        else if (url.includes('facebook')) icon = '<i class="fab fa-facebook"></i>';
                        else if (url.includes('whatsapp')||url.includes('wa.me')) icon = '<i class="fab fa-whatsapp"></i>';
                        return `<a href="${l.url}" target="_blank" class="dynamic-link-btn" style="background-color:${l.color};">${icon} ${l.title}</a>`;
                    }).join('')}</div>` : '';
                return `<div class="modal-overlay" style="display:flex;"><div class="modal-content"><button class="modal-close-btn" onclick="closeModal()">&times;</button><div class="modal-body" style="padding-top:10px;">${nh}${lh}<button class="action-button" style="margin-top:20px;background:var(--text-secondary-color);" onclick="closeModal()">Close</button></div></div></div>`;
            }

            if (id === 'notificationModal') {
                const msgs = localDataCache.admin_messages || {};
                const uid = String(telegramUser.id);
                let html = '<p>No new messages.</p>';
                const filtered = Object.entries(msgs).filter(([_, m]) => !m.isPrivate || m.recipientUid === uid).sort((a, b) =>
                    b[1].timestamp - a[1].timestamp);
                if (filtered.length > 0) {
                    html = filtered.map(([k, m]) =>
                        `<div class="admin-message"><h4>${m.title}</h4><p>${m.text}</p><small>${new Date(m.timestamp).toLocaleString()}</small></div>`
                    ).join('');
                }
                return `<div class="modal-overlay" style="display:flex;"><div class="modal-content"><button class="modal-close-btn" onclick="closeModal()">&times;</button><h2 class="modal-header"><i class="fas fa-envelope"></i> Admin Messages</h2><div class="modal-body">${html}</div></div></div>`;
            }

            if (id === 'adminMessagePopup') {
                const [key, msg] = args;
                return `<div class="modal-overlay" style="display:flex;"><div class="modal-content"><h2 class="modal-header"><i class="fas fa-bell"></i> New Message</h2><div class="modal-body"><h3>${msg.title}</h3><p style="margin-top:10px;">${msg.text}</p><button class="action-button" style="margin-top:20px;" onclick="dismissAdminMessage('${key}')">OK</button></div></div></div>`;
            }

            if (id === 'planExpiryNotice') {
                return `<div class="modal-overlay" style="display:flex;"><div class="modal-content"><h2 class="modal-header"><i class="fas fa-exclamation-triangle" style="color:var(--warning);"></i> Plan Expiry</h2><div class="modal-body" style="text-align:center;"><p>Your plan is expiring soon. Please purchase a new plan.</p><button class="action-button" style="margin-top:20px;" onclick="navigateTo('plan');closeModal();">Go to Plans</button><button class="action-button" style="margin-top:10px;background:var(--text-secondary-color);" onclick="closeModal()">Dismiss</button></div></div></div>`;
            }

            if (id === 'helplineModal') {
                return `<div class="modal-overlay" style="display:flex;"><div class="modal-content"><button class="modal-close-btn" onclick="closeModal()">&times;</button><h2 class="modal-header"><i class="fas fa-headset"></i> Help & Support</h2><div class="modal-body"><form onsubmit="handleHelpRequest(event)"><div class="form-group"><label>Problem Type</label><select name="problemType" required><option>Deposit Problem</option><option>Withdraw Problem</option><option>Task Problem</option><option>Account Problem</option><option>Other</option></select></div><div class="form-group"><label>Message</label><textarea name="message" rows="4" required placeholder="Write your message..."></textarea></div><button type="submit" class="action-button">Send Message</button></form></div></div></div>`;
            }
            return '';
        }

        // ============================================================
        //  MODAL HELPERS: Deposit, Withdrawal steps
        // ============================================================
        function showDepositStep(step) {
            document.querySelectorAll('.deposit-step').forEach(el => el.style.display = 'none');
            document.querySelectorAll('.deposit-header').forEach(el => el.style.display = 'none');
            document.getElementById(`deposit-step-${step}`).style.display = 'block';
            document.getElementById(`deposit-header-step${step}`).style.display = 'block';
        }

        function selectDepositMethod(methodName, number, minAmount) {
            const min = parseFloat(minAmount) || 0;
            document.getElementById('deposit-payment-number').innerText = number || 'N/A';
            document.getElementById('deposit-min-amount-display').textContent = `ন্যূনতম: ${formatCurrency(min)}`;
            document.getElementById('deposit-method').value = methodName;
            const inp = document.querySelector("#deposit-modal-form input[name='amount']");
            if (inp) { inp.min = min;
                inp.placeholder = `সর্বনিম্ন ${formatCurrency(min)}`;
                inp.value = ''; }
            showDepositStep(2);
        }

        function showWithdrawStep(step) {
            document.querySelectorAll('.withdraw-step').forEach(el => el.style.display = 'none');
            document.querySelectorAll('.withdraw-header').forEach(el => el.style.display = 'none');
            document.getElementById(`withdraw-step-${step}`).style.display = 'block';
            document.getElementById(`withdraw-header-step${step}`).style.display = 'block';
        }

        function selectWithdrawalSource(source, maxAmount) {
            selectedWithdrawal = { source, maxAmount };
            showWithdrawStep(1);
        }

        function selectWithdrawMethod(methodName, methodLogo) {
            const methods = Object.values(appSettings.withdrawMethods || {});
            const selected = methods.find(m => m.name === methodName);
            if (!selected) return showTopNotification('Invalid method.', 'error');
            const min = selectedWithdrawal.source === 'plan' ? (parseFloat(selected.minWithdrawPlan) || 0) : (parseFloat(
                selected.minWithdrawFree) || 0);

            document.getElementById('withdraw-info-display').innerHTML =
                `<img src="${methodLogo}" style="height:50px;margin-bottom:5px;"><br><strong>${methodName}</strong>`;
            document.getElementById('withdraw-account-label').textContent = `Your ${methodName} Number`;
            document.getElementById('withdraw-form-method').value = methodName;
            document.getElementById('withdraw-back-btn').onclick = () => showWithdrawStep(1);

            const inp = document.querySelector("#withdraw-form input[name='amount']");
            if (inp) { inp.min = min;
                inp.max = selectedWithdrawal.maxAmount;
                inp.placeholder = `Min: ${formatCurrency(min)} | Available: ${formatCurrency(selectedWithdrawal.maxAmount)}`;
                inp.value = ''; }
            calculateWithdrawalCharge();
            showWithdrawStep(2);
        }

        function calculateWithdrawalCharge() {
            const inp = document.querySelector("#withdraw-form input[name='amount']");
            const div = document.getElementById('withdraw-charge-info');
            if (!inp || !div) return;
            const amt = parseFloat(inp.value);
            if (isNaN(amt) || amt <= 0) { div.innerHTML = ''; return; }
            const method = document.getElementById('withdraw-form-method').value;
            const methods = Object.values(appSettings.withdrawMethods || {});
            const selected = methods.find(m => m.name === method);
            const charge = parseFloat(selected?.charge) || 0;
            const cAmt = (amt * charge) / 100;
            const net = amt - cAmt;
            div.innerHTML =
                `<p>চার্জ (${charge}%): ${formatCurrency(cAmt)}</p><p>পাবেন: <strong>${formatCurrency(net)}</strong></p>`;
        }

        // ============================================================
        //  ACTIVATION HANDLER
        // ============================================================
        async function handleActivation(event) {
            event.preventDefault();
            const form = event.target;
            const data = {
                userId: String(telegramUser.id),
                name: currentUserData.name,
                amount: appSettings.activationFee || 0,
                trxId: form.elements.trxId.value,
                method: form.elements.method.value,
                status: 'Pending',
                date: new Date().toISOString(),
                isActivation: true
            };
            const key = dbRootRef.child('deposits').push().key;
            const updates = {};
            updates[`/deposits/${key}`] = data;
            updates[`/users/${String(telegramUser.id)}/transactions/${key}`] = {
                ...data,
                reason: 'Activation Fee',
                type: 'credit',
                category: 'activation',
                timestamp: firebase.database.ServerValue.TIMESTAMP,
                linkedKey: key
            };
            await dbRootRef.update(updates);
            showTopNotification('Activation request sent.', 'success');
            closeModal();
        }

        // ============================================================
        //  COUPON REDEEM
        // ============================================================
        async function handleCouponRedeem(event) {
            event.preventDefault();
            const code = document.getElementById('coupon-code-input').value.trim().toUpperCase();
            if (!code) return showTopNotification('Enter a coupon code.', 'error');
            const btn = event.target.querySelector('button');
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> যাচাই...';
            try {
                const snap = await dbRootRef.child('coupons').orderByChild('code').equalTo(code).once('value');
                if (!snap.exists()) throw new Error('অবৈধ কুপন কোড।');
                const coupons = snap.val();
                const cKey = Object.keys(coupons)[0];
                const cData = coupons[cKey];
                const uid = String(telegramUser.id);
                if (currentUserData.usedCoupons && currentUserData.usedCoupons[cKey]) throw new Error(
                    'ইতিমধ্যে ব্যবহার করেছেন।');
                if (cData.useCount >= cData.limit) throw new Error('কুপন লিমিট শেষ।');
                if (cData.expiryDate && new Date() > new Date(cData.expiryDate)) throw new Error('মেয়াদ শেষ।');

                const updates = {};
                updates[`/coupons/${cKey}/useCount`] = firebase.database.ServerValue.increment(1);
                updates[`/users/${uid}/usedCoupons/${cKey}`] = true;
                await awardPoints(cData.reward, `Coupon: ${cData.code}`, 'coupon_reward', updates);

                // Reset coupon ads
                const today = new Date().toLocaleDateString("en-CA");
                await dbRootRef.child(`users/${uid}/couponAdsViewed/${today}`).set(0);
                if (currentUserData.couponAdsViewed) currentUserData.couponAdsViewed[today] = 0;

                closeModal();
                showTopNotification(`Coupon redeemed! +${formatCurrency(cData.reward)}`, 'success');
                notifyCouponRedeem(cData.code, cData.reward);
                setTimeout(() => startCouponAdSequence(), 1000);
            } catch (e) { showTopNotification(e.message, 'error'); } finally {
                btn.disabled = false;
                btn.innerHTML = 'রিডিম করুন';
            }
        }

        // ============================================================
        //  PROFILE PIC UPLOAD
        // ============================================================
        function triggerProfilePicUpload() { document.getElementById('profilePicInput').click(); }

        function handleProfilePicUpload(event) {
            const file = event.target.files[0];
            if (!file || !file.type.startsWith('image/')) return;
            const uid = String(telegramUser.id);
            const ref = storage.ref(`profile_pictures/${uid}/${file.name}`);
            const task = ref.put(file);
            task.on('state_changed', null,
                e => { console.error(e);
                    showTopNotification('Upload failed.', 'error'); },
                () => task.snapshot.ref.getDownloadURL().then(url =>
                    dbRootRef.child(`users/${uid}`).update({ photoURL: url }).then(() => showTopNotification(
                        'Profile picture updated!', 'success'))
                )
            );
        }

        // ============================================================
        //  REFERRAL
        // ============================================================
        async function handleReferralActivation(newUserId) {
            const refUser = localDataCache.users[newUserId];
            if (!refUser || !refUser.isActive || refUser.referralBonusGiven || !refUser.referredBy) return;
            const referrerUid = refUser.referredBy;
            const referrerData = localDataCache.users[referrerUid];
            if (!referrerData) return;
            const bonus = appSettings.referralBonus || 0;
            const updates = { [`/users/${newUserId}/referralBonusGiven`]: true };
            if (bonus > 0) {
                await awardPoints(bonus, `Referral Bonus for ${refUser.name}`, 'referral_bonus', updates, referrerUid);
            } else {
                await dbRootRef.update(updates);
            }
        }

        function showReferralHistory() {
            const refs = currentUserData.referrals || {};
            if (Object.keys(refs).length === 0) return showTopNotification('No referrals.', 'error');
            openModal('referralHistoryModal');
            const listEl = document.getElementById('referral-list');
            listEl.innerHTML = 'Loading...';
            let html = '';
            const allUsers = localDataCache.users || {};
            for (const uid of Object.keys(refs)) {
                const u = allUsers[uid];
                if (u) {
                    const badge =
                        `<span class="status-badge ${u.isActive ? 'status-active' : 'status-inactive'}">${u.isActive ? 'Active' : 'Inactive'}</span>`;
                    html +=
                        `<div class="list-item"><div><strong>${u.name}</strong><br><small>Joined: ${new Date(u.createdAt).toLocaleDateString()}</small></div><div>${badge}</div></div>`;
                }
            }
            listEl.innerHTML = html || 'No referral data.';
        }

        // ============================================================
        //  HELP REQUEST
        // ============================================================
        async function handleHelpRequest(event) {
            event.preventDefault();
            const form = event.target;
            const problem = form.problemType.value;
            const msg = form.message.value.trim();
            if (!msg) return showTopNotification('Please describe your problem.', 'error');
            const data = {
                userId: String(telegramUser.id),
                userName: currentUserData.name,
                problem,
                message: msg,
                timestamp: firebase.database.ServerValue.TIMESTAMP,
                status: 'Pending'
            };
            try {
                await dbRootRef.child('help_requests').push(data);
                showTopNotification('Message sent to admin.', 'success');
                closeModal();
            } catch (e) { showTopNotification('Failed to send.', 'error'); }
        }

        // ============================================================
        //  ADMIN MESSAGE / NOTIFICATIONS
        // ============================================================
        function checkNotifications() {
            const msgs = localDataCache.admin_messages || {};
            const read = currentUserData.readMessages || {};
            const uid = String(telegramUser.id);
            const unread = Object.keys(msgs).filter(k => !read[k] && (!msgs[k].isPrivate || msgs[k].recipientUid === uid))
                .length;
            const dot = document.getElementById('notification-dot');
            if (dot) dot.style.display = unread > 0 ? 'block' : 'none';
        }

        function checkAndShowAdminMessagePopup() {
            const msgs = localDataCache.admin_messages || {};
            const read = currentUserData.readMessages || {};
            const uid = String(telegramUser.id);
            const unread = Object.entries(msgs).filter(([k, m]) => !read[k] && (!m.isPrivate || m.recipientUid === uid))
                .sort((a, b) => b[1].timestamp - a[1].timestamp);
            if (unread.length > 0) {
                const [key, msg] = unread[0];
                openModal('adminMessagePopup', key, msg);
            }
        }

        function checkPlanExpiryNotification() {
            const plan = currentUserData.activePlan;
            if (plan && plan.expiryDate) {
                const days = Math.ceil((new Date(plan.expiryDate) - new Date()) / (1000 * 3600 * 24));
                if (days > 0 && days <= 1 && !sessionStorage.getItem('planExpiryNotifShown')) {
                    openModal('planExpiryNotice');
                    sessionStorage.setItem('planExpiryNotifShown', 'true');
                }
            }
        }

        async function dismissAdminMessage(key) {
            await dbRootRef.child(`users/${String(telegramUser.id)}/readMessages/${key}`).set(true);
            closeModal();
        }

        function checkAndShowWelcomeNotice() {
            if (sessionStorage.getItem('welcome') || !appSettings.noticeText) return;
            openModal('welcomeNotice');
            sessionStorage.setItem('welcome', 'true');
        }

        // ============================================================
        //  BALANCE CALCULATION
        // ============================================================
        function calculateIncomeBalances() {
            const txs = Object.values(currentUserData.transactions || {});
            let plan = 0,
                free = 0;
            txs.forEach(tx => {
                if (tx.type === 'credit' && tx.status === 'Approved') {
                    if (['plan_income', 'admin_credit_plan', 'gmail_job'].includes(tx.category)) plan += tx.amount;
                    else if (['ad_reward', 'spin_reward', 'scratch_reward', 'task_reward', 'referral_bonus',
                            'admin_credit_free', 'coupon_reward'
                        ].includes(tx.category) || !tx.category) free += tx.amount;
                } else if (tx.type === 'debit') {
                    const amt = tx.requestedAmount || tx.amount;
                    if (tx.category === 'withdraw_plan' || tx.category === 'admin_debit_plan') plan -= amt;
                    else if (tx.category === 'withdraw_free' || tx.category === 'admin_debit_free') free -= amt;
                }
            });
            currentUserData.planIncomeBalance = Math.max(0, plan);
            currentUserData.freeIncomeBalance = Math.max(0, free);
        }

        // ============================================================
        //  IMAGE SLIDER
        // ============================================================
        function initializeImageSlider() {
            if (sliderInterval) clearInterval(sliderInterval);
            const wrapper = document.getElementById('slider-wrapper');
            if (!wrapper || wrapper.children.length <= 1) return;
            let idx = 0;
            const slides = wrapper.children;
            sliderInterval = setInterval(() => {
                idx = (idx + 1) % slides.length;
                wrapper.style.transform = `translateX(-${idx * 100}%)`;
            }, 5000);
        }

        function extractYouTubeID(url) {
            const match = url.match(/^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/);
            return (match && match[2].length === 11) ? match[2] : url;
        }

        // ============================================================
        //  INIT
        // ============================================================
        document.addEventListener('DOMContentLoaded', function() {
            refreshBannerAd();
            document.getElementById('adLoadingOverlay').style.display = 'none';
            initTelegramApp();
        });
    </script>
</body>
